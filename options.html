<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site Blocker Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 620px; margin: 40px auto; padding: 0 16px; }
    form { margin-top: 20px; }
    ul { list-style: none; padding: 0; margin: 16px 0 0; }
    li {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 0; border-top: 1px solid var(--border);
    }
    li:first-child { border-top: none; }
    li .domain { flex: 1; word-break: break-all; }
    li.disabled .domain { color: var(--muted); text-decoration: line-through; }
    .empty { text-align: center; padding: 24px 0; }
    .count { margin-top: 24px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Site Blocker</h1>
    <p class="muted">Sites in this list (and their subdomains) are blocked. Changes apply immediately.</p>

    <div id="incognito-warning" class="warning" hidden></div>

    <div class="card">
      <form id="add-form" class="row">
        <input id="add-input" type="text" placeholder="e.g. youtube.com or paste a link" autocomplete="off">
        <button type="submit" class="primary">Block</button>
      </form>
      <p id="error" class="error"></p>
      <ul id="list"></ul>
    </div>
    <p id="count" class="count muted"></p>
  </main>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
