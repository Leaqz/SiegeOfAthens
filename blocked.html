<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blocked</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { max-width: 420px; text-align: center; padding: 32px 28px; }
    .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
    #domain { font-weight: 600; color: var(--accent); word-break: break-all; }
    .row { justify-content: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⛔</div>
    <h1>Site blocked</h1>
    <p class="muted">You chose to block <span id="domain">this site</span>.</p>
    <div class="row">
      <button id="back" class="primary">Go back</button>
      <button id="settings">Settings</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
